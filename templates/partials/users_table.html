<table class="w-full text-sm">
	<thead class="border-b border-gray-200 dark:border-neutral-700">
		<tr class="text-gray-500 dark:text-neutral-500">
			<th class="py-1 pr-4 text-left font-normal">ID</th>
			<th class="py-1 text-left font-normal">Name</th>
			<th></th>
		</tr>
	</thead>
	<tbody class="font-light text-gray-500 dark:text-neutral-400">
		{% for user in users %}
		<tr>
			<td class="pt-2">{{ user.id }}</td>
			{% if edit_id == user.id %}
			<td class="pt-2">
				<form
					id="edit-{{ user.id }}"
					method="post"
					action="/users/{{ user.id }}/update"
					class="flex items-center gap-2"
					data-on:submit="@post('/users/{{ user.id }}/update', {contentType: 'form'})"
				>
					<input
						name="name"
						value="{{ user.name or '' }}"
						aria-label="User name"
						class="w-full border-b border-gray-300 bg-transparent text-sm text-gray-700 outline-none dark:border-neutral-500 dark:text-neutral-300"
					/>
				</form>
			</td>
			{% else %}
			<td class="pt-2">{{ user.name or '' }}</td>
			{% endif %}
			<td class="flex justify-end gap-2 pt-2">
				{% if edit_id == user.id %}
				<button
					type="submit"
					form="edit-{{ user.id }}"
					class="text-primary-500 dark:text-primary-400 cursor-pointer text-xs"
				>Save</button>
				<a href="/" class="cursor-pointer text-xs text-gray-400 hover:text-gray-600 dark:text-neutral-500 dark:hover:text-neutral-300">Cancel</a>
				{% else %}
				<a href="/?edit={{ user.id }}" aria-label="Edit user" class="cursor-pointer">
					<edit-icon svgClass="dark:hover:text-primary-500 hover:text-primary-500 size-4 text-gray-400 dark:text-neutral-500"></edit-icon>
				</a>
				<form method="post" action="/users/{{ user.id }}/delete" data-confirm="Delete this user?">
					<button
						type="submit"
						aria-label="Delete user"
						class="cursor-pointer"
						data-on:click__prevent="confirm('Delete this user?') && @post('/users/{{ user.id }}/delete', {contentType: 'form'})"
					>
						<trash-icon svgClass="size-4 text-gray-400 hover:text-red-600 dark:text-neutral-500 dark:hover:text-red-600"></trash-icon>
					</button>
				</form>
				{% endif %}
			</td>
		</tr>
		{% endfor %}
	</tbody>
</table>
